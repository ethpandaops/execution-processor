name: Build branch docker image

# Publishes ghcr.io/ethpandaops/execution-processor (mirrored to
# docker.io/ethpandaops/execution-processor) images for a branch, with only
# GITHUB_TOKEN. Each tag is one amd64 + arm64 image:
#
# - Pushes to release/<name> publish <name>-latest, <name> and <name>-<sha7>.
# - Same-repository pull requests labelled build-docker-image publish <branch>
#   and <branch>-<sha7>, built from the PR head commit, not the merge commit.
# - Manual dispatch builds the selected branch the same way, optionally under
#   a custom tag.
#
# Outside release/ refs, names that would overwrite a release image are
# refused (see the prepare job).
#
# This triggers on pull_request, NOT pull_request_target: fork PRs get no
# secrets or package write access and are skipped. Dispatch the workflow on a
# trusted branch to publish one.

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker tag (defaults to the branch name; ignored on release/ branches)"
        required: false

# One build per PR or ref; a newer push cancels the running build. Adding any
# other label to a PR gets its own group, so it can't cancel a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.event.label.name != 'build-docker-image' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Resolve image tags
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      name: ${{ steps.resolve.outputs.name }}
      sha: ${{ steps.resolve.outputs.sha }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Resolve name and tags
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'build-docker-image') }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          DOCKER_TAG: ${{ inputs.docker_tag }}
          # The exact PR head, so the image is the branch's code and not the
          # PR/master merge commit.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          release=false
          if [[ $GITHUB_REF == refs/heads/release/* ]]; then
            release=true
            name=${GITHUB_REF#refs/heads/release/}
          else
            name=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
            if [[ -n $DOCKER_TAG ]]; then
              name=$DOCKER_TAG
            fi
          fi
          # Docker tags allow [A-Za-z0-9_.-] only.
          name=${name//[^A-Za-z0-9_.-]/-}
          sha=${PR_HEAD_SHA:-$GITHUB_SHA}
          sha7=${sha:0:7}

          build=false
          case $EVENT in
            push | workflow_dispatch)
              build=true
              ;;
            pull_request)
              if [[ $HAS_LABEL != true ]]; then
                echo "No build-docker-image label."
              elif [[ $ACTION == labeled && $ADDED_LABEL != build-docker-image ]]; then
                echo "The added label is ${ADDED_LABEL}, not build-docker-image."
              elif [[ $SAME_REPOSITORY != true ]]; then
                echo "::notice::Skipping a fork PR; dispatch this workflow on a trusted branch to publish it."
              else
                build=true
              fi
              ;;
          esac

          # Never overwrite a release or latest image from a branch build.
          if [[ $build == true && $release == false ]]; then
            skip=""
            if [[ $name == master || $name == main || $name == *latest ]]; then
              skip="${name} is reserved for releases"
            elif [[ $name =~ ^v?[0-9] ]]; then
              skip="${name} looks like a version"
            else
              # Prints the names whose tags include tags of $1: $1 itself and
              # $1 without a -<sha7> suffix.
              roots() {
                local x=$1
                echo "$x"
                if [[ $x =~ ^(.+)-[0-9a-f]{7}$ ]]; then
                  echo "${BASH_REMATCH[1]}"
                fi
              }
              # A failed lookup fails the job rather than risk overwriting a
              # release image.
              heads=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" 'release/*')
              # Compared after slugifying, as release/<a>/<b> publishes <a>-<b>.
              # Skip when a tag this build publishes (<name>, <name>-<sha7>) is
              # also one the release branch publishes, e.g. name oom-abcdef1
              # for release/oom.
              while read -r _ ref; do
                [[ $ref == refs/heads/release/* ]] || continue
                taken=${ref#refs/heads/release/}
                taken=${taken//[^A-Za-z0-9_.-]/-}
                if grep -qxF -- "$taken" <<< "$(roots "$name")" || grep -qxF -- "$name" <<< "$(roots "$taken")"; then
                  skip="${name} overlaps the images of ${ref#refs/heads/}"
                  break
                fi
              done <<< "$heads"
            fi
            if [[ -n $skip ]]; then
              echo "::warning::Not building: ${skip}. Rename the branch or dispatch with another docker_tag."
              build=false
            fi
          fi

          # A Docker tag is at most 128 characters; the longest has the
          # 8-character -<sha7> suffix.
          if [[ $build == true && ! $name =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$ ]]; then
            echo "::error::${name} can't be a Docker tag: it must start with [A-Za-z0-9_] and be at most 120 characters."
            exit 1
          fi

          if [[ $release == true ]]; then
            tags="${name}-latest ${name} ${name}-${sha7}"
          else
            tags="${name} ${name}-${sha7}"
          fi

          echo "event=${EVENT} release=${release} name=${name} sha=${sha} build=${build} tags=${tags}"
          {
            echo "build=${build}"
            echo "name=${name}"
            echo "sha=${sha}"
            echo "sha7=${sha7}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build docker image
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/ethpandaops/execution-processor
      NAME: ${{ needs.prepare.outputs.name }}
      SHA: ${{ needs.prepare.outputs.sha }}
      SHA7: ${{ needs.prepare.outputs.sha7 }}
      TAGS: ${{ needs.prepare.outputs.tags }}
    outputs:
      digests: ${{ steps.attest.outputs.digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/workflows/go-setup
      # .goreleaser.yaml's builds (CGO_ENABLED=0, same ldflags), with the
      # release stamped as <name>-<sha7> instead of <tag>-<sha7>.
      - name: Build binaries
        run: |
          set -euo pipefail
          # The Dockerfile copies the binary as ./server from a context that
          # holds just that binary, as goreleaser's docker pipe provides.
          for arch in amd64 arm64; do
            mkdir -p "${RUNNER_TEMP}/context/${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags "-s -w -X github.com/ethpandaops/execution-processor/internal/version.Release=${NAME}-${SHA7} -X github.com/ethpandaops/execution-processor/internal/version.GitCommit=${SHA7}" \
              -o "${RUNNER_TEMP}/context/${arch}/server" .
            file "${RUNNER_TEMP}/context/${arch}/server"
          done
      # The Dockerfile runs apk and chown, which need emulation for linux/arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Each platform is built from its own binary and pushed by digest, then
      # the two are joined into one multi-arch manifest under every tag.
      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          refs=()
          for arch in amd64 arm64; do
            meta="${RUNNER_TEMP}/metadata-${arch}.json"
            docker buildx build "${RUNNER_TEMP}/context/${arch}" \
              --file Dockerfile \
              --platform "linux/${arch}" \
              --provenance=false \
              --sbom=false \
              --label "org.opencontainers.image.created=${created}" \
              --label "org.opencontainers.image.title=execution-processor" \
              --label "org.opencontainers.image.revision=${SHA}" \
              --label "org.opencontainers.image.version=${NAME}-${SHA7}" \
              --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$meta"
            refs+=("${IMAGE}@$(jq -r '."containerimage.digest"' "$meta")")
          done
          read -ra tags <<<"$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${IMAGE}:${tag}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${NAME}-${SHA7}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "${TAGS} are ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest image
        id: attest
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: execution-processor
          tags: ${{ env.TAGS }}
          digest: ${{ steps.image.outputs.digest }}
          mirror: "false"

  # Separate job, so "Re-run failed jobs" retries only the mirror and never
  # rebuilds the image.
  mirror:
    name: Mirror to Docker Hub
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: execution-processor
          tags: ${{ needs.build.outputs.digests }}
          attest: "false"
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
